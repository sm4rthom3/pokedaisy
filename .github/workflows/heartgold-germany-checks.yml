name: HeartGold Germany checks
on:
  push:
    branches: [codex/heartgold-germany-checks]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - run: python3 scripts/check_translations.py
      - run: ./gradlew :app:testDebugUnitTest --tests '*HeartGoldGermanTest' --tests '*HeartGoldDecodeTest' --tests '*NdsNamesTest' --tests '*SiteDataExportTest' --tests '*GameTitlesTest' --tests '*Gen4GuideTest' --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: heartgold-germany-test-reports
          path: app/build/reports/tests/
          retention-days: 7
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: node --test test/docs.test.js test/docsearch.test.js test/compat.test.js
      - run: npm run build
